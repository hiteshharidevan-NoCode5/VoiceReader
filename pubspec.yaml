name: voicereader
description: Read EPUB ebooks in your own cloned voice.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  epubx: ^4.0.0
  file_picker: ^8.1.2
  http: ^1.2.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  record: ^6.1.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
